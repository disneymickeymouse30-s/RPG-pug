<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141C33">
<title>パグの無料旅行記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{
  --night:#141C33; --ai:#26355A; --noren:#2F4C96; --nori:#1F3529; --nori2:#2A4636;
  --hinoki:#E8CC97; --hinoki-d:#B8955C; --yu:#82D4CB; --sakura:#F2A0B3;
  --paper:#FFF6E3; --ink:#1A1A1A; --gold:#F5C94C; --hp:#8BD17C; --mp:#7FB7F0; --bad:#F07A6B;
  --bg:#141C33;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#10172B; } }
:root[data-theme="dark"]{ --bg:#10172B; }
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--paper);
  font-family:"DotGothic16","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overflow:hidden;touch-action:manipulation;
  -webkit-text-size-adjust:100%}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;overflow:hidden;background:var(--night)}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
.btn{background:var(--nori2);border:2px solid var(--hinoki);border-radius:8px;padding:10px 10px;min-height:48px;font-size:17px;color:var(--paper);line-height:1.3}
.btn:active{transform:translateY(2px);background:#365a45}
.btn:disabled{opacity:.38;transform:none}
.btn:focus-visible,.dp:focus-visible,.abtn:focus-visible{outline:3px solid var(--yu);outline-offset:2px}
.btn.sub{background:transparent;border-color:var(--hinoki-d);color:var(--hinoki)}
.win{background:var(--nori);border:3px solid var(--hinoki);border-radius:10px;box-shadow:inset 0 0 0 2px var(--nori),inset 0 0 0 3px rgba(232,204,151,.3)}
svg{display:block}
.face svg,.spr svg,.dot svg,.head svg{height:auto}

/* ---------- title ---------- */
#scr-title{background:linear-gradient(var(--night) 0%,#1D2A4D 52%,#2B4466 100%);align-items:center}
.rod{width:calc(100% - 28px);height:12px;margin-top:16px;background:linear-gradient(#D9B47A,#9E7A44);border-radius:6px;box-shadow:0 3px 0 #5d4321;position:relative;z-index:2}
.noren{display:flex;gap:7px;width:calc(100% - 52px);margin-top:-4px}
.flap{flex:1;height:min(38vh,230px);background:linear-gradient(90deg,#2A4589,var(--noren) 30%,var(--noren) 70%,#2A4589);border-radius:0 0 6px 6px;
  display:flex;justify-content:center;padding-top:16px;transform-origin:50% 0;box-shadow:0 6px 12px rgba(0,0,0,.35)}
.flap span{writing-mode:vertical-rl;text-orientation:upright;font-size:clamp(28px,9vw,42px);letter-spacing:.06em;color:#FFFDF6;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.flap:nth-child(2) span{color:var(--gold)}
@keyframes sway{0%{transform:rotate(0) translateY(-40%);opacity:0}45%{transform:rotate(2.4deg) translateY(0);opacity:1}70%{transform:rotate(-1.4deg)}100%{transform:rotate(0)}}
.flap{animation:sway 1.4s cubic-bezier(.3,1.3,.5,1) both}
.flap:nth-child(2){animation-delay:.12s}.flap:nth-child(3){animation-delay:.24s}
.subtitle{margin:14px 0 0;font-size:clamp(15px,4.4vw,19px);color:var(--hinoki);letter-spacing:.04em}
.bath{position:relative;width:200px;height:96px;margin:10px auto 0}
.bath .tub{position:absolute;left:0;right:0;bottom:0;height:46px;background:linear-gradient(#9BE0D8,#57AFA6);border-radius:50% 50% 14px 14px/30% 30% 14px 14px;border:4px solid #A8834F;z-index:3}
.bath .tub::after{content:"";position:absolute;left:12%;right:12%;top:6px;height:5px;border-radius:3px;background:rgba(255,255,255,.55)}
.bath .head{position:absolute;bottom:22px;width:78px;z-index:2}
.steam{position:absolute;width:14px;height:40px;border-radius:50%;border-left:4px solid rgba(255,255,255,.55);bottom:60px;animation:steam 3.2s ease-in infinite;z-index:4}
@keyframes steam{0%{transform:translateY(10px) scaleX(1);opacity:0}30%{opacity:.9}100%{transform:translateY(-40px) scaleX(-1);opacity:0}}
.title-menu{display:flex;flex-direction:column;gap:10px;width:min(78%,320px);margin:18px auto 0}
.title-foot{margin:auto 0 12px;font-size:13px;color:#9FB0D0;text-align:center;line-height:1.6;padding:0 12px}
.clear-mark{color:var(--gold)}

/* ---------- field ---------- */
#scr-field{background:#0D1322}
.hud{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 6px;font-size:15px;color:var(--hinoki);gap:8px}
.hud .free{color:var(--yu)}
.view{position:relative;width:min(100%,56vh);aspect-ratio:1/1;margin:0 auto;border-top:3px solid var(--hinoki-d);border-bottom:3px solid var(--hinoki-d)}
#cv{width:100%;height:100%;display:block;background:#000}
.pad{flex:1;display:flex;justify-content:space-between;align-items:center;padding:6px 16px 10px;min-height:178px}
.dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px);gap:4px}
.dp{border:2px solid var(--hinoki-d);background:var(--nori2);border-radius:12px;font-size:22px;color:var(--hinoki);touch-action:none}
.dp:active,.dp.held{background:#3E6B52}
.dp.c{visibility:hidden}
.abtns{display:flex;flex-direction:column;gap:12px;align-items:center}
.abtn{width:86px;height:86px;border-radius:50%;border:3px solid var(--hinoki);background:#7A3A33;color:var(--paper);font-size:17px;box-shadow:0 4px 0 #4a201b}
.abtn:active{transform:translateY(3px);box-shadow:0 1px 0 #4a201b}
.mbtn{min-width:96px;min-height:44px;border-radius:22px;font-size:15px}

/* ---------- world ---------- */
#scr-world{background:#EFE3C7;color:var(--ink)}
.w-head{padding:12px 16px 8px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px solid #2F4C96;background:#F7EEDA}
.w-head h2{margin:0;font-size:20px;color:#2F4C96;font-weight:normal}
.w-head .g{font-size:15px}
.w-goal{margin:10px 16px 0;padding:8px 12px;background:#2F4C96;color:#fff;border-radius:8px;font-size:15px;line-height:1.5}
.w-line{flex:1;overflow:auto;padding:14px 16px 10px;position:relative}
.st{position:relative;display:flex;align-items:center;gap:14px;padding:10px 0 10px 4px}
.st::before{content:"";position:absolute;left:21px;top:0;bottom:0;width:8px;background:#2F4C96}
.st:first-child::before{top:50%}.st:last-child::before{bottom:50%}
.st.lock::before{background:repeating-linear-gradient(#9AA6C3 0 8px,transparent 8px 14px)}
.st .dot{position:relative;z-index:1;width:42px;height:42px;border-radius:50%;background:#fff;border:6px solid #2F4C96;flex:none;display:grid;place-items:center;overflow:hidden}
.st.lock .dot{border-color:#9AA6C3}
.st .dot svg{width:44px;margin-top:6px}
.st .go{flex:1;text-align:left;background:#fff;border:2px solid #2F4C96;border-radius:10px;padding:10px 14px;min-height:56px;color:var(--ink);font-size:18px}
.st .go small{display:block;font-size:12px;color:#5A6585;margin-top:2px}
.st .go:disabled{border-color:#9AA6C3;color:#9AA6C3;background:#F4EEE0}
.st .go:active{background:#E3ECFF}
.w-foot{padding:8px 16px 14px;display:flex;justify-content:flex-end;gap:10px}
.w-foot .btn{background:#2F4C96;border-color:#2F4C96}

/* ---------- battle ---------- */
#scr-battle{background:#0D1322}
.b-stage{position:relative;flex:0 0 36%;min-height:180px;display:flex;align-items:flex-end;justify-content:center;padding:8px 6px 6px;overflow:hidden}
.bg-village{background:linear-gradient(#9FD3F0 0%,#CDEBF5 55%,#8CC56E 55.5%,#6FA855 100%)}
.bg-forest{background:linear-gradient(#2E5A3A 0%,#4C7C4A 50%,#3F6B33 50.5%,#2B4E25 100%)}
.bg-town{background:linear-gradient(#F3C58F 0%,#F6DDB4 50%,#C9B38E 50.5%,#A8916B 100%)}
.bg-castle{background:linear-gradient(#3B3449 0%,#58506A 52%,#6E6680 52.5%,#4D465C 100%)}
.bg-maou{background:linear-gradient(#2A1020 0%,#5B2236 50%,#5A3A4A 50.5%,#381E2A 100%)}
.b-stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(transparent 55%,rgba(0,0,0,.25))}
.b-enemies{display:flex;gap:2px;justify-content:center;align-items:flex-end;width:100%;position:relative;z-index:1}
.enemy{position:relative;display:flex;flex-direction:column;align-items:center;width:31%;max-width:132px;border:none;background:none;padding:0}
.enemy.boss{width:64%;max-width:250px}
.enemy .spr{width:100%;filter:drop-shadow(0 5px 0 rgba(0,0,0,.25))}
.enemy .spr svg{width:100%;height:auto}
.enemy .en-name{font-size:12px;background:rgba(15,20,35,.78);padding:1px 6px;border-radius:5px;margin-top:2px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.enemy.boss .en-name{font-size:15px}
.enemy .en-hp{font-size:11px;background:rgba(15,20,35,.78);padding:0 5px;border-radius:4px;margin-top:2px}
.enemy.gone{display:none}
.enemy.pickable .spr{animation:pickpulse 1s ease-in-out infinite;cursor:pointer}
@keyframes pickpulse{50%{filter:drop-shadow(0 0 8px #fff) brightness(1.1)}}
.bar{height:7px;background:rgba(0,0,0,.45);border-radius:4px;overflow:hidden;width:100%}
.bar i{display:block;height:100%;background:var(--hp);transition:width .35s}
.bar.mp i{background:var(--mp)}
.enemy .bar{width:80%;margin-top:3px}
.enemy .bar i{background:var(--bad)}
.b-log{margin:6px 8px 0;padding:8px 12px;min-height:76px;font-size:15px;line-height:1.6}
.b-log p{margin:0}
.b-log p.big{color:var(--gold);font-size:17px}
.b-party{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px 8px 0}
.pc{position:relative;display:grid;grid-template-columns:40px 1fr;gap:6px;align-items:center;padding:5px 7px;border-radius:9px;background:var(--nori);border:2px solid var(--hinoki-d)}
.pc .face svg{width:42px;height:auto}
.pc .nm{display:flex;justify-content:space-between;font-size:14px}
.pc .nm small{color:var(--hinoki);font-size:12px}
.pc .num{font-size:11px;color:#CFE3D4;display:flex;justify-content:space-between;margin:1px 0 2px}
.pc .stt{position:absolute;right:6px;top:-9px;font-size:11px;background:var(--bad);color:#fff;border-radius:5px;padding:0 4px}
.pc.act{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.pc.ko{filter:grayscale(1);opacity:.55}
.b-cmd{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 10px 12px;margin-top:auto;max-height:42vh;overflow:auto}
.b-cmd .btn{min-height:50px;font-size:16px}
.b-cmd .btn small{display:block;font-size:12px;color:var(--hinoki)}
.b-cmd .wide{grid-column:1/-1}
@keyframes dash{0%{transform:none}40%{transform:translateY(-28px) scale(1.06)}100%{transform:none}}
.pc.dash{animation:dash .38s ease}
@keyframes hit{0%,100%{transform:none;filter:none}20%{transform:translateX(-9px);filter:brightness(2.2)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.enemy.hit .spr{animation:hit .36s}
@keyframes blow{to{transform:translate(30px,-70px) rotate(25deg) scale(.5);opacity:0}}
.enemy.dying{animation:blow .55s ease-in forwards}
@keyframes lunge{50%{transform:translateY(18px) scale(1.12)}}
.enemy.lunge .spr{animation:lunge .32s}
@keyframes hurt{0%,100%{transform:none}25%{transform:translateX(-6px);background:#7a2a24}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.pc.hurt{animation:hurt .36s}
@keyframes jump{0%,100%{transform:none}40%{transform:translateY(-20px)}}
.pc.lvl{animation:jump .45s 2}
.pop{position:absolute;left:50%;top:28%;font-size:26px;color:#fff;text-shadow:0 2px 0 #000,0 0 6px #000;animation:pop .9s forwards;pointer-events:none;z-index:6;white-space:nowrap}
.pop.heal{color:var(--hp)}.pop.mpc{color:var(--mp)}.pop.crit{color:var(--gold);font-size:32px}
@keyframes pop{0%{transform:translate(-50%,6px);opacity:0}20%{transform:translate(-50%,-12px);opacity:1}100%{transform:translate(-50%,-36px);opacity:0}}
.spark{position:absolute;width:10px;height:10px;pointer-events:none;z-index:6;animation:spark .8s forwards}
.spark::before{content:"✦";position:absolute;inset:-6px;color:#FFF6A8;font-size:16px}
@keyframes spark{0%{transform:scale(.2);opacity:0}30%{opacity:1}100%{transform:translateY(-26px) scale(1.1);opacity:0}}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:5}
#flash.on{animation:flash .35s}
@keyframes flash{30%{opacity:.75}}
#scr-battle.shake{animation:hurt .35s}
.lvbanner{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-size:34px;color:var(--gold);text-shadow:0 3px 0 #6b4a10,0 0 10px rgba(0,0,0,.6);z-index:7;animation:lvb 1.4s forwards;pointer-events:none;white-space:nowrap}
@keyframes lvb{0%{transform:translate(-50%,20px) scale(.6);opacity:0}25%{transform:translate(-50%,0) scale(1.15);opacity:1}75%{opacity:1}100%{transform:translate(-50%,-20px);opacity:0}}

/* ---------- message ---------- */
#msg{position:absolute;left:8px;right:8px;bottom:8px;z-index:40;display:none;padding:12px 16px 26px;min-height:150px;font-size:17px;line-height:1.7}
#msg.on{display:block}
#msg-name{display:inline-block;background:var(--hinoki);color:var(--ink);padding:0 10px;border-radius:6px;font-size:14px;margin-bottom:4px}
#msg-text{white-space:pre-wrap;min-height:2.6em}
#msg-text.big{font-size:23px;color:var(--gold);line-height:1.5}
#msg-more{position:absolute;right:16px;bottom:6px;color:var(--hinoki);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#msg-opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
#msg-opts .btn{flex:1 1 40%}

/* ---------- modal ---------- */
#modal{position:absolute;inset:0;z-index:30;display:none;background:rgba(5,8,16,.6);align-items:center;justify-content:center;padding:14px}
#modal.on{display:flex}
#modal .panel{width:100%;max-height:88%;display:flex;flex-direction:column}
#modal .mh{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:2px solid rgba(232,204,151,.35)}
#modal .mh h3{margin:0;font-size:19px;font-weight:normal;color:var(--hinoki)}
#modal .mh .btn{min-height:40px;padding:4px 14px;font-size:15px}
#modal-body{overflow:auto;padding:10px 12px 14px;font-size:15px;line-height:1.6}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs .btn{flex:1 1 auto;min-height:42px;font-size:15px;padding:6px 8px}
.tabs .btn.on{background:var(--hinoki);color:var(--ink)}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(232,204,151,.18)}
.row .grow{flex:1;min-width:0}
.row small{display:block;color:#BFD3C4;font-size:12px}
.row .btn{min-height:42px;padding:4px 12px;font-size:15px}
.note{color:var(--hinoki);font-size:13px;margin:4px 0 8px}
.goldline{display:flex;justify-content:space-between;color:var(--gold);margin-bottom:6px}
.help h4{margin:12px 0 2px;color:var(--yu);font-weight:normal;font-size:16px}
.help p{margin:0 0 4px}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 10px;font-size:14px;margin-top:4px}
input.name{width:100%;font:inherit;font-size:22px;padding:10px 12px;border-radius:8px;border:2px solid var(--hinoki);background:#10241A;color:var(--paper);margin:8px 0 12px;user-select:text;-webkit-user-select:text}

/* ---------- ending ---------- */
#scr-ending{background:linear-gradient(#F6B98A 0%,#F7D6A8 45%,#7DA7C9 100%);align-items:center;color:var(--ink)}
.end-scene{position:relative;width:100%;height:46%;margin-top:6%}
.end-scene .bath{width:92%;height:100%}
.end-scene .bath .tub{height:44%}
.end-scene .bath .head{width:21%;bottom:30%}
.end-card{display:none;flex-direction:column;align-items:center;text-align:center;padding:10px 20px;gap:6px}
.end-card.on{display:flex}
.end-card h2{font-weight:normal;font-size:clamp(18px,5.4vw,24px);margin:6px 0;color:#2F4C96}
.end-card p{margin:0;font-size:15px;line-height:1.7}
.end-card .btn{margin-top:10px;background:#2F4C96;border-color:#2F4C96;min-width:180px}

@media (prefers-reduced-motion: reduce){
  .flap,.steam,#msg-more{animation:none!important}
  .enemy.pickable .spr{animation:none;filter:drop-shadow(0 0 6px #fff)}
}
@media (min-height:760px){ .pad{min-height:200px} }
</style>
</head>
<body>
<div id="app">

  <section id="scr-title" class="screen on" aria-label="タイトル">
    <div class="rod"></div>
    <div class="noren" aria-hidden="true">
      <div class="flap"><span>パグの</span></div>
      <div class="flap"><span>無料</span></div>
      <div class="flap"><span>旅行記</span></div>
    </div>
    <h1 class="subtitle">～味付けのりと温泉を求めて～</h1>
    <div class="bath" id="title-bath"></div>
    <div class="title-menu">
      <button class="btn" id="t-new">はじめから</button>
      <button class="btn" id="t-cont">つづきから</button>
      <button class="btn sub" id="t-help">あそびかた</button>
      <button class="btn sub" id="t-set">設定</button>
    </div>
    <p class="title-foot" id="t-foot"></p>
  </section>

  <section id="scr-world" class="screen" aria-label="路線図">
    <div class="w-head"><h2>ブサ犬王国 無料旅行路線図</h2><span class="g" id="w-gold"></span></div>
    <div class="w-goal" id="w-goal"></div>
    <div class="w-line" id="w-line"></div>
    <div class="w-foot"><button class="btn" id="w-menu">メニュー</button></div>
  </section>

  <section id="scr-field" class="screen" aria-label="フィールド">
    <div class="hud"><span id="hud-area"></span><span><span class="free" id="hud-free"></span>　<span id="hud-gold"></span></span></div>
    <div class="view"><canvas id="cv" width="352" height="352"></canvas></div>
    <div class="pad">
      <div class="dpad" role="group" aria-label="移動">
        <button class="dp c" tabindex="-1" aria-hidden="true"></button>
        <button class="dp" data-d="up" aria-label="上">▲</button>
        <button class="dp c" tabindex="-1" aria-hidden="true"></button>
        <button class="dp" data-d="left" aria-label="左">◀</button>
        <button class="dp c" tabindex="-1" aria-hidden="true"></button>
        <button class="dp" data-d="right" aria-label="右">▶</button>
        <button class="dp c" tabindex="-1" aria-hidden="true"></button>
        <button class="dp" data-d="down" aria-label="下">▼</button>
        <button class="dp c" tabindex="-1" aria-hidden="true"></button>
      </div>
      <div class="abtns">
        <button class="abtn" id="f-act">しらべる</button>
        <button class="btn mbtn" id="f-menu">メニュー</button>
      </div>
    </div>
  </section>

  <section id="scr-battle" class="screen" aria-label="戦闘">
    <div class="b-stage" id="b-stage"><div class="b-enemies" id="b-enemies"></div><div id="flash"></div></div>
    <div class="b-log win" id="b-log" aria-live="polite"></div>
    <div class="b-party" id="b-party"></div>
    <div class="b-cmd" id="b-cmd"></div>
  </section>

  <section id="scr-ending" class="screen" aria-label="エンディング">
    <div class="end-scene"><div class="bath" id="end-bath"></div></div>
    <div class="end-card" id="end-card"></div>
  </section>

  <div id="modal" role="dialog" aria-modal="true">
    <div class="panel win">
      <div class="mh"><h3 id="modal-title"></h3><button class="btn sub" id="modal-x">とじる</button></div>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="msg" class="win" role="status" aria-live="polite">
    <div id="msg-name"></div>
    <div id="msg-text"></div>
    <div id="msg-opts"></div>
    <div id="msg-more">▼</div>
  </div>
</div>
<script>
'use strict';
(function(){
/* ================= utilities ================= */
const $=s=>document.querySelector(s);

const Snd={ctx:null,master:null,timer:null,cur:null,want:null,
  init(){
    if(this.ctx)return;
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
    try{this.ctx=new AC();this.master=this.ctx.createGain();this.master.gain.value=Pref.sound?0.55:0;this.master.connect(this.ctx.destination);}
    catch(e){this.ctx=null;return;}
    if(this.want)this.bgm(this.want,true);
  },
  resume(){if(this.ctx&&this.ctx.state==='suspended'){try{this.ctx.resume();}catch(e){}}},
  setOn(v){Pref.sound=v;savePref();if(this.master)this.master.gain.value=v?0.55:0;},
  tone(f,d,type,vol,at){
    if(!this.ctx||!Pref.sound)return;
    try{const t=Math.max(this.ctx.currentTime,at||0);const o=this.ctx.createOscillator(),g=this.ctx.createGain();
      o.type=type||'square';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(vol||0.1,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
      o.connect(g);g.connect(this.master);o.start(t);o.stop(t+d+0.05);}catch(e){}
  },
  seq(notes,step,type,vol){if(!this.ctx)return;const t0=this.ctx.currentTime;notes.forEach((n,i)=>{if(n)this.tone(mf(n),step*1.7,type,vol,t0+i*step);});},
  sfx(n){
    if(!this.ctx||!Pref.sound)return; const ct=this.ctx.currentTime;
    switch(n){
      case 'sel':this.tone(988,.07,'square',.05);break;
      case 'blip':this.tone(760,.03,'square',.018);break;
      case 'hit':this.tone(170,.14,'sawtooth',.12);this.tone(95,.18,'square',.07,ct+.02);break;
      case 'crit':this.seq([88,84,79],.035,'square',.08);this.tone(120,.25,'sawtooth',.12,ct+.1);break;
      case 'hurt':this.tone(230,.1,'sawtooth',.1);this.tone(115,.2,'square',.07,ct+.05);break;
      case 'heal':this.seq([72,76,79,84],.07,'triangle',.12);break;
      case 'magic':this.seq([60,64,67,72,76,79],.035,'sawtooth',.05);break;
      case 'ice':this.seq([96,91,88,84,79],.05,'triangle',.09);break;
      case 'lvl':this.seq([72,76,79,84,0,84,88],.08,'square',.07);break;
      case 'win':this.seq([67,72,76,79,0,76,79,84],.09,'square',.07);break;
      case 'flee':this.seq([79,74,67,62],.05,'square',.06);break;
      case 'chest':this.seq([76,79,84,88],.06,'square',.07);break;
      case 'bark':this.tone(540,.06,'square',.08);this.tone(430,.09,'square',.08,ct+.1);break;
      case 'onsen':this.seq([60,67,72,76,79,84],.12,'triangle',.09);break;
      case 'lose':this.seq([67,63,60,55],.22,'triangle',.1);break;
      case 'buff':this.seq([60,67,72,79,84,91],.05,'square',.06);break;
      case 'join':this.seq([72,0,72,76,79,0,84],.08,'square',.07);break;
      case 'free':this.seq([84,88,91,96],.05,'triangle',.09);break;
    }
  },
  bgm(name,force){
    this.want=name; if(!this.ctx)return; if(this.cur===name&&!force)return;
    this.stop(); this.cur=name; const tr=TRACKS[name]; if(!tr)return;
    const sp=60/tr.bpm/2; let i=0; let next=this.ctx.currentTime+0.08;
    this.timer=setInterval(()=>{
      if(!this.ctx)return; const now=this.ctx.currentTime; if(next<now-0.4)next=now+0.05;
      while(next<now+0.25){const l=tr.lead[i%tr.lead.length],b=tr.bass[i%tr.bass.length];
        if(l)this.tone(mf(l),sp*0.9,tr.wave||'square',0.04,next); if(b)this.tone(mf(b),sp*0.95,'triangle',0.07,next); i++; next+=sp;}
    },90);
  },
  stop(){if(this.timer)clearInterval(this.timer);this.timer=null;this.cur=null;}
};

/* ================= state ================= */
let G=null;
function heroName(m){return m.id==='sakichi'?(G?G.name:'さきち'):HEROES[m.id].name;}
function heroStat(m){
  const h=HEROES[m.id],L=m.lv-1,s={};
  for(const k of ['hp','mp','atk','def','agi','mag'])s[k]=Math.floor(h.base[k]+h.gr[k]*L);
  for(const sl of ['w','a','c']){const it=m.eq&&m.eq[sl]&&ITEMS[m.eq[sl]];if(it){for(const k of ['atk','def','agi','hp','mp','mag'])if(it[k])s[k]+=it[k];}}
  return {mhp:s.hp,mmp:s.mp,atk:s.atk,def:s.def,agi:s.agi,mag:s.mag};
}
function mkHero(id,lv){
  const m={id,lv:lv||1,exp:EXP[lv||1],hp:1,mp:0,eq:{w:'shamoji',a:'collar',c:null},isHero:true};
  const s=heroStat(m);m.hp=s.mhp;m.mp=s.mmp;return m;
}
function learned(m){
  const out=HEROES[m.id].skills.filter(x=>x[0]<=m.lv).map(x=>x[1]);
  if(m.id==='sakichi'&&G.flags.muryo)out.push('muryo');
  return out;
}
function newGame(name){
  G={v:1,name,gold:30,party:[mkHero('sakichi',1)],inv:{nori:2},flags:{},chests:{},free:[],p:0,
     map:'village',x:3,y:3,dir:'up',station:'village',onsen:0,playMs:0,coupon:false,encDown:0,tension:0,steps:0};
}
function inParty(id){return G.party.some(m=>m.id===id);}
function addItem(id,n){G.inv[id]=(G.inv[id]||0)+(n||1);}
function useItemCount(id){if(!G.inv[id])return false;G.inv[id]--;if(G.inv[id]<=0)delete G.inv[id];return true;}
function healAll(){for(const m of G.party){const s=heroStat(m);m.hp=s.mhp;m.mp=s.mmp;}}
function joinHero(id){
  const lead=G.party[0];const m=mkHero(id,Math.max(1,lead.lv));m.exp=Math.max(EXP[m.lv],Math.floor(lead.exp*0.95));G.party.push(m);
}

/* ================= message window ================= */
const Msg={
  setup(){
    this.el=$('#msg');this.nm=$('#msg-name');this.tx=$('#msg-text');this.more=$('#msg-more');this.op=$('#msg-opts');
    this.el.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;e.preventDefault();this.tap();});
  },
  on(){return this.el.classList.contains('on');},
  tap(){
    if(this.typing){this.finish();return;}
    if(this.res){const r=this.res;this.res=null;Snd.sfx('sel');r();}
  },
  parse(raw){
    let big=false,s=String(raw);if(s[0]==='!'){big=true;s=s.slice(1);}
    let name='';const i=s.indexOf('|');if(i>=0){name=s.slice(0,i);s=s.slice(i+1);}
    const nm=G?G.name:'さきち';if(name==='@')name=nm;s=s.replace(/@/g,nm);
    return {big,name,text:s};
  },
  line(raw,opts){
    const p=this.parse(raw);
    return new Promise(res=>{
      clearTimeout(this.hideT);clearInterval(this.timer);
      this.el.classList.add('on');this.op.innerHTML='';
      this.nm.textContent=p.name;this.nm.style.display=p.name?'inline-block':'none';
      this.tx.classList.toggle('big',p.big);this.tx.textContent='';this.more.style.visibility='hidden';
      this.full=p.text;this.opts=opts||null;this.res=opts?null:res;this.optRes=opts?res:null;this.typing=true;
      let i=0;const sp=Pref.fast?8:26;
      this.timer=setInterval(()=>{i++;this.tx.textContent=this.full.slice(0,i);if(i%2===0)Snd.sfx('blip');if(i>=this.full.length)this.finish();},sp);
    });
  },
  finish(){
    clearInterval(this.timer);this.timer=null;this.typing=false;this.tx.textContent=this.full;
    if(this.opts){
      this.op.innerHTML='';
      this.opts.forEach((o,i)=>{const b=el('button','btn',esc(o));b.addEventListener('click',e=>{e.stopPropagation();if(!this.optRes)return;Snd.sfx('sel');const r=this.optRes;this.optRes=null;this.opts=null;this.op.innerHTML='';r(i);});this.op.appendChild(b);});
      const f=this.op.querySelector('button');if(f)f.focus({preventScroll:true});
    }else this.more.style.visibility='visible';
  },
  hide(){this.hideT=setTimeout(()=>{this.el.classList.remove('on');this.op.innerHTML='';},40);},
  async say(...lines){for(const l of lines)await this.line(l);this.hide();},
  async ask(q,opts){const r=await this.line(q,opts);this.hide();return r;}
};
const S=(...l)=>Msg.say(...l);
const A=(q,o)=>Msg.ask(q,o);

/* ================= save / load ================= */
function writeSave(){
  if(!G)return false;
  try{return Store.set(SAVE_KEY,JSON.stringify(G));}catch(e){return false;}
}
function autosave(){if(G&&(curScreen==='field'||curScreen==='world'))writeSave();}
function readSave(){
  const raw=Store.get(SAVE_KEY);if(!raw)return null;
  try{
    const d=JSON.parse(raw);
    if(!d||typeof d!=='object'||!Array.isArray(d.party)||!d.party.length)return null;
    const g={v:1,name:typeof d.name==='string'&&d.name?d.name.slice(0,6):'さきち',gold:Math.max(0,Number(d.gold)||0),party:[],inv:{},flags:{},chests:{},free:[],
      p:clamp(Number(d.p)||0,0,8),map:typeof d.map==='string'?d.map:'village',x:Number(d.x)||0,y:Number(d.y)||0,dir:d.dir||'up',
      station:typeof d.station==='string'?d.station:'village',onsen:Number(d.onsen)||0,playMs:Number(d.playMs)||0,coupon:!!d.coupon,
      encDown:Number(d.encDown)||0,tension:Number(d.tension)||0,steps:Number(d.steps)||0};
    for(const m of d.party){
      if(!m||!HEROES[m.id]||g.party.some(x=>x.id===m.id))continue;
      const h={id:m.id,lv:clamp(Number(m.lv)||1,1,MAXLV),exp:Number(m.exp)||0,hp:0,mp:0,eq:{w:null,a:null,c:null},isHero:true};
      for(const sl of ['w','a','c']){const it=m.eq&&m.eq[sl];if(it&&ITEMS[it]&&ITEMS[it].type===sl)h.eq[sl]=it;}
      const s=heroStat(h);h.hp=clamp(Number(m.hp)||0,0,s.mhp);h.mp=clamp(Number(m.mp)||0,0,s.mmp);
      g.party.push(h);
    }
    if(!g.party.length||g.party[0].id!=='sakichi')return null;
    if(d.inv&&typeof d.inv==='object')for(const k of Object.keys(d.inv)){const n=Math.floor(Number(d.inv[k]));if(ITEMS[k]&&n>0)g.inv[k]=Math.min(n,99);}
    if(d.flags&&typeof d.flags==='object')for(const k of Object.keys(d.flags))g.flags[k]=!!d.flags[k];
    if(d.chests&&typeof d.chests==='object')for(const k of Object.keys(d.chests))g.chests[k]=!!d.chests[k];
    if(Array.isArray(d.free))g.free=d.free.filter(x=>FREE_NAMES[x]).filter((x,i,a)=>a.indexOf(x)===i);
    if(g.party.every(m=>m.hp<=0))g.party.forEach(m=>{m.hp=heroStat(m).mhp;});
    return g;
  }catch(e){return 'broken';}
}

function drawTree(c,x,y,s,th){
  c.fillStyle=th.trunk;c.fillRect(x+s*.43,y+s*.6,s*.14,s*.32);
  c.fillStyle=th.tree;c.beginPath();c.arc(x+s*.5,y+s*.42,s*.4,0,Math.PI*2);c.fill();

      break;}
    case 'f':ground();
      for(const [fx,fy,col] of [[.25,.3,'#F2A0B3'],[.68,.55,'#FFF6E3'],[.4,.72,'#F5C94C']]){c.fillStyle=col;c.beginPath();c.arc(x+s*fx,y+s*fy,s*.07,0,Math.PI*2);c.fill();}
      break;
    case ':':c.fillStyle=th.grass||th.ground;c.fillRect(x,y,S1,S1);c.strokeStyle=th.blade||'#000';c.lineWidth=Math.max(1.5,s*.05);
      for(const [bx,by] of [[.22,.35],[.62,.25],[.42,.7],[.8,.66]]){if((h+bx*10)%4<1)continue;c.beginPath();c.moveTo(x+s*(bx-.07),y+s*(by-.12));c.lineTo(x+s*bx,y+s*by);c.lineTo(x+s*(bx+.07),y+s*(by-.12));c.stroke();}
      break;
    case ',':

      c.fillRect(x,y+s*.48,S1,s*.05);c.fillRect(x,y+s*.97,S1,s*.05);
      {const o=gy%2?s*.5:0;c.fillRect(x+o+s*.0,y,s*.05,s*.48);c.fillRect(x+(o?0:s*.5),y+s*.5,s*.05,s*.48);}

}
function drawShadow(c,x,y,s){c.fillStyle='rgba(0,0,0,.18)';c.beginPath();c.ellipse(x+s*.5,y+s*.9,s*.32,s*.09,0,0,Math.PI*2);c.fill();}

      {const a=(Math.sin(time/300)+1)/2;c.fillStyle=`rgba(255,255,255,${.4+a*.5})`;c.font=`${fs}px sans-serif`;c.textAlign='center';c.fillText('✦',x+s*.62,y+s*.48);}

      for(let k=0;k<2;k++){const ph=((time/1600)+k*.5)%1;c.strokeStyle=`rgba(255,255,255,${(1-ph)*.65})`;c.lineWidth=Math.max(1.5,s*.04);c.beginPath();c.arc(x+s*(.38+k*.24),y+s*(.42-ph*.4),s*.1,Math.PI*.8,Math.PI*1.7);c.stroke();}

    m.el.querySelector('.hpt').textContent=`HP ${m.hp}/${s.mhp}`;m.el.querySelector('.mpt').textContent=`MP ${m.mp}`;
    m.el.querySelector('.nm small').textContent=`Lv${m.lv}`;
    m.el.classList.toggle('ko',m.hp<=0);
    let old=m.el.querySelector('.stt');if(old)old.remove();
    const b=m.b||{};const tags=[];if(b.sleep)tags.push('ねむり');if(b.karashi)tags.push('からい');if(b.blind)tags.push('ゆげ');if(b.atk>1.2)tags.push('魂');
    if(tags.length&&m.hp>0)m.el.appendChild(el('span','stt',tags.join('・')));
  },
  log(t,big){
    const B=this.B;if(t===null){B.lines=[];}else B.lines.push({t,big});
    B.lines=B.lines.slice(-3);
    $('#b-log').innerHTML=B.lines.map(l=>`<p class="${l.big?'big':''}">${esc(l.t)}</p>`).join('');
  },
  async say(t,ms){
    let big=false;if(t[0]==='!'){big=true;t=t.slice(1);}
    t=t.replace(/@/g,G.name);this.log(t,big);
    await wait((ms||620)*(Pref.fast?0.55:1));
  },
  anim(node,cls,ms){if(!node)return;node.classList.remove(cls);void node.offsetWidth;node.classList.add(cls);setTimeout(()=>node.classList.remove(cls),ms||450);},
  pop(target,text,cls){
    const host=target.isHero?target.el:target.el;if(!host)return;
    const p=el('div','pop '+(cls||''),esc(text));host.appendChild(p);setTimeout(()=>p.remove(),950);
  },
  sparks(target){
    const host=target.el;if(!host)return;
    for(let i=0;i<4;i++){const s=el('span','spark');s.style.left=(15+Math.random()*70)+'%';s.style.top=(20+Math.random()*50)+'%';s.style.animationDelay=(i*0.08)+'s';host.appendChild(s);setTimeout(()=>s.remove(),1100);}
  },
  flash(color){const f=$('#flash');f.style.background=color||'#fff';this.anim(f,'on',400);},
  shake(){this.anim($('#scr-battle'),'shake',400);},
  /* ---------- command input ---------- */
  choose(opts){
    const box=$('#b-cmd');box.innerHTML='';
    return new Promise(res=>{
      this.pickRes=res;
      opts.forEach(o=>{
        const b=el('button','btn'+(o.wide?' wide':''),esc(o.l)+(o.s?`<small>${esc(o.s)}</small>`:''));
        b.disabled=!!o.dis;
        b.addEventListener('click',()=>{if(this.pickRes!==res)return;this.pickRes=null;Snd.sfx('sel');res({v:o.v});});
        box.appendChild(b);
      });
      const f=box.querySelector('button:not(:disabled)');if(f)f.focus({preventScroll:true});
    }).then(r=>{box.innerHTML='';this.B.en.forEach(e=>e.el&&e.el.classList.remove('pickable'));return r.v;});
  },
  async pickEnemy(){
    const al=this.B.en.filter(e=>e.hp>0);
    if(al.length===1)return al[0];
    al.forEach(e=>e.el.classList.add('pickable'));
    const opts=al.map(e=>({l:e.name,v:e}));opts.push({l:'もどる',v:'back',wide:true});
    this.log('だれを攻撃する？（敵をタップしてもOK）');
    const r=await this.choose(opts);return r==='back'?null:r;
  },
  async pickAlly(prompt){
    const al=G.party.filter(m=>m.hp>0);
    const opts=al.map(m=>{const s=heroStat(m);return {l:heroName(m),s:`HP ${m.hp}/${s.mhp}`,v:m};});opts.push({l:'もどる',v:'back',wide:true});
    this.log(prompt||'だれに使う？');const r=await this.choose(opts);return r==='back'?null:r;
  },
  async pickTarget(kind,m){
    if(kind==='enemy'){const t=await this.pickEnemy();return t||undefined;}
    if(kind==='enemies'||kind==='party')return 'all';
    if(kind==='self')return m;
    const t=await this.pickAlly();return t||undefined;
  },
  async chooseFor(m,canBack){
    while(true){
      this.log(`${heroName(m)}は どうする？`);
      const main=[{l:'たたかう',v:'atk'},{l:'とくぎ',v:'skill'},{l:'どうぐ',v:'item'},{l:'ぼうぎょ',v:'guard'}];
      main.push({l:'にげる',v:'flee',dis:!!this.B.opt.boss||!!this.B.opt.tutorial});
      if(canBack)main.push({l:'もどる',v:'back'});
      const c=await this.choose(main);
      if(c==='back')return 'back';
      if(c==='guard')return {type:'guard',actor:m};
      if(c==='flee')return {type:'flee',actor:m};
      if(c==='atk'){const t=await this.pickEnemy();if(t)return {type:'atk',actor:m,target:t};continue;}
      if(c==='skill'){
        const ks=learned(m);const opts=ks.map(k=>{const sk=SKILLS[k];const dis=m.mp<sk.mp||(sk.kind==='nori'&&!G.inv.nori);return {l:sk.name,s:sk.mp?`MP ${sk.mp}`:(sk.kind==='nori'?`のり ×${G.inv.nori||0}`:'MP 0'),v:k,dis};});
        opts.push({l:'もどる',v:'back',wide:true});this.log('どのとくぎを使う？');
        const k=await this.choose(opts);if(k==='back')continue;
        const tg=await this.pickTarget(SKILLS[k].tgt,m);if(tg===undefined)continue;
        return {type:'skill',actor:m,skill:k,target:tg};
      }
      if(c==='item'){
        const ids=Object.keys(G.inv).filter(k=>ITEMS[k].type==='use'&&G.inv[k]>0);
        if(!ids.length){this.log('使えるどうぐを持っていない。');await wait(700);continue;}
        const opts=ids.map(k=>({l:ITEMS[k].name,s:`×${G.inv[k]} ${ITEMS[k].desc}`,v:k}));opts.push({l:'もどる',v:'back',wide:true});
        this.log('どのどうぐを使う？');const k=await this.choose(opts);if(k==='back')continue;
        const tg=await this.pickTarget(ITEMS[k].tgt,m);if(tg===undefined)continue;
        return {type:'item',actor:m,item:k,target:tg};
      }
    }
  },
  async commandPhase(){
    const alive=G.party.filter(m=>m.hp>0);const acts=new Array(alive.length).fill(null);
    const can=m=>!(m.b.sleep>0||m.b.stun>0);
    let i=0;
    while(i<alive.length){
      const m=alive[i];
      if(!can(m)){acts[i]={type:'skipped',actor:m};i++;continue;}
      alive.forEach(x=>x.el&&x.el.classList.toggle('act',x===m));
      let j=i-1;while(j>=0&&!can(alive[j]))j--;
      const r=await this.chooseFor(m,j>=0);
      if(r==='back'){i=j;continue;}
      if(r.type==='flee'){
        alive.forEach(x=>x.el&&x.el.classList.remove('act'));
        if(await this.tryFlee())return 'flee';
        return [];
      }
      acts[i]=r;i++;
    }
    alive.forEach(x=>x.el&&x.el.classList.remove('act'));
    return acts.filter(Boolean);
  },
  async tryFlee(){
    await this.say(`${G.name}たちは にげだした！`,600);
    const pa=Math.max(...G.party.filter(m=>m.hp>0).map(m=>st(m,'agi')));const ea=Math.max(...this.B.en.filter(e=>e.hp>0).map(e=>e.agi));
    if(Math.random()<clamp(0.62+(pa-ea)*0.015,0.35,0.92)){Snd.sfx('flee');await this.say('うまく にげきれた！',700);return true;}
    await this.say('しかし まわりこまれてしまった！',800);
    return false;
  },
  /* ---------- turn execution ---------- */
  async execTurn(acts){
    const B=this.B;const q=[];
    for(const a of acts){
      const sp=st(a.actor,'agi')*a.actor.b.agi*(0.75+Math.random()*0.5);
      const prio=(a.type==='guard'||(a.type==='skill'&&SKILLS[a.skill].kind==='guard'))?1000:0;
      q.push(Object.assign({spd:sp+prio},a));
    }
    for(const e of B.en){if(e.hp<=0)continue;
      const n=(e.final&&e.hp<e.max*0.5)?2:1;
      for(let k=0;k<n;k++)q.push({type:'enemy',actor:e,spd:e.agi*e.b.agi*(0.75+Math.random()*0.5)-k*50});
    }
    q.sort((a,b)=>b.spd-a.spd);
    for(const a of q){
      if(this.check())break;
      if(a.actor.hp<=0)continue;
      await this.doAct(a);
    }
    if(!this.check())await this.endTurn();
    G.party.forEach(m=>{m.b.guard=0;});B.en.forEach(e=>{e.b.guard=0;});
    B.turn++;
  },
  async endTurn(){
    const B=this.B;
    for(const x of [...G.party,...B.en]){
      if(x.hp<=0)continue;
      if(x.b.karashi>0){
        x.b.karashi--;const d=Math.max(2,Math.round(st(x,'mhp')*0.05));
        await this.damage(x,d,false,`${x.isHero?heroName(x):x.name}は からさで ${d}のダメージ！`);
        if(this.check())return;
      }
      if(x.b.blind>0)x.b.blind--;
    }
    if(B.healDown>0){B.healDown--;if(!B.healDown)await this.say('温泉封鎖の効果が切れた！',650);}
    G.party.forEach(m=>this.updHero(m));
  },
  nm(x){return x.isHero?heroName(x):x.name;},
  async doAct(a){
    const x=a.actor;
    if(x.b.sleep>0){
      x.b.sleep--;
      if(x.b.sleep<=0){await this.say(`${this.nm(x)}は 目をさました！`,600);if(x.isHero)this.updHero(x);return;}
      await this.say(`${this.nm(x)}は ぐうぐう ねむっている…`,650);return;
    }
    if(x.b.stun>0){x.b.stun--;await this.say(`${this.nm(x)}は ひるんで 動けない！`,650);return;}
    if(a.type==='skipped')return;
    if(a.type==='guard'){x.b.guard=1;await this.say(`${this.nm(x)}は 身を守っている。`,550);return;}
    if(a.type==='atk'){
      let t=a.target;if(!t||t.hp<=0)t=pickOne(this.B.en.filter(e=>e.hp>0));if(!t)return;
      await this.say(`${this.nm(x)}の こうげき！`,380);await this.physical(x,t,1);return;
    }
    if(a.type==='skill')return this.useSkill(x,a.skill,a.target);
    if(a.type==='item')return this.useItem(x,a.item,a.target);
    if(a.type==='enemy')return this.enemyAct(x);
  },
  calc(att,tgt,pow){
    const A=st(att,'atk')*att.b.atk*pow*(0.88+Math.random()*0.24);
    const D=st(tgt,'def')*tgt.b.def;
    let d=Math.round(A-D*0.4);
    if(tgt.b.guard===2)d=Math.floor(d*0.35);else if(tgt.b.guard===1)d=Math.floor(d*0.5);
    return Math.max(1,d);
  },
  async physical(att,tgt,pow){
    if(att.isHero)this.anim(att.el,'dash',420);else this.anim(att.el,'lunge',360);
    await wait(200);
    if(att.b.blind>0&&Math.random()<0.5){await this.say('湯けむりで 前が見えない！ 攻撃は空ぶりした！',650);return;}
    if(Math.random()<0.04){this.pop(tgt,'ミス');await this.say(`ミス！ ${this.nm(tgt)}は ひらりとかわした！`,600);return;}
    const crit=att.isHero&&Math.random()<1/16;
    let d=this.calc(att,tgt,pow);if(crit)d=Math.round(d*1.5)+2;
    if(crit){this.flash('#FFF6A8');Snd.sfx('crit');await this.say('!会心の一撃！',450);}
    await this.damage(tgt,d,crit);
  },
  async damage(tgt,d,crit,text){
    tgt.hp=Math.max(0,tgt.hp-d);
    if(tgt.isHero){this.anim(tgt.el,'hurt',420);this.shake();Snd.sfx('hurt');this.updHero(tgt);}
    else{this.anim(tgt.el,'hit',420);if(!crit)Snd.sfx('hit');this.updEnemy(tgt);}
    this.pop(tgt,String(d),crit?'crit':'');
    await this.say(text||`${this.nm(tgt)}に ${d}のダメージ！`,560);
    if(tgt.hp<=0){
      if(tgt.isHero){tgt.b.sleep=0;tgt.b.karashi=0;tgt.b.blind=0;this.updHero(tgt);await this.say(`${heroName(tgt)}は たおれた…`,700);}
      else{tgt.el.classList.add('dying');await this.say(`${tgt.name}を たおした！`,600);tgt.el.classList.add('gone');}
    }
  },
  async heal(tgt,amt,mpAmt){
    if(tgt.hp<=0)return;
    const s=heroStat(tgt);const k=this.B.healDown>0?0.5:1;
    if(amt){const v=Math.min(s.mhp-tgt.hp,Math.round(amt*k));tgt.hp+=v;this.pop(tgt,'+'+v,'heal');}
    if(mpAmt){const v=Math.min(s.mmp-tgt.mp,Math.round(mpAmt));tgt.mp+=v;this.pop(tgt,'+'+v,'mpc');}
    this.sparks(tgt);this.updHero(tgt);
  },
  async useSkill(x,k,t){
    const sk=SKILLS[k];
    if(x.mp<sk.mp){await this.say(`${heroName(x)}は MPが たりない！`,600);return;}
    x.mp-=sk.mp;this.updHero(x);
    const nm=heroName(x);
    if(sk.kind==='phys'){
      if(!t||t.hp<=0)t=pickOne(this.B.en.filter(e=>e.hp>0));if(!t)return;
      await this.say(`${nm}の ${sk.name}！`,420);await this.physical(x,t,sk.pow);return;
    }
    if(sk.kind==='mag'){
      await this.say(`${nm}は ${sk.name}を となえた！`,420);
      Snd.sfx(sk.fx==='ice'?'ice':'magic');this.flash(sk.fx==='ice'?'#BDEBFF':'#FFB46B');
      this.anim(x.el,'dash',420);await wait(250);
      const tg=t==='all'?this.B.en.filter(e=>e.hp>0):[(t&&t.hp>0)?t:pickOne(this.B.en.filter(e=>e.hp>0))];
      for(const e of tg){if(!e||e.hp<=0)continue;const A=st(x,'mag')*sk.pow*(0.9+Math.random()*0.2);const d=Math.max(1,Math.round(A-st(e,'def')*0.15));await this.damage(e,d,false);if(this.check())break;}
      return;
    }
    if(sk.kind==='heal'){
      await this.say(`${nm}の ${sk.name}！`,420);Snd.sfx('heal');
      const tg=t==='all'?G.party.filter(m=>m.hp>0):[t];
      for(const m of tg){if(!m||m.hp<=0)continue;await this.heal(m,st(x,'mag')*sk.pow+sk.add);}
      await this.say(this.B.healDown>0?'HPが回復した！（温泉封鎖で効果半減）':'HPが回復した！',560);return;
    }
    if(sk.kind==='cure'){
      await this.say(`${nm}の ${sk.name}！`,420);Snd.sfx('heal');
      if(!t||t.hp<=0)return;const had=t.b.sleep||t.b.karashi||t.b.blind;t.b.sleep=0;t.b.karashi=0;t.b.blind=0;this.sparks(t);this.updHero(t);
      await this.say(had?`${heroName(t)}は すっきりした！`:`${heroName(t)}の しわが ピカピカになった！`,650);return;
    }
    if(sk.kind==='guard'){x.b.guard=2;Snd.sfx('buff');await this.say(`${nm}は おすわりして 守りをかためた！`,600);return;}
    if(sk.kind==='stun'){
      if(!t||t.hp<=0)t=pickOne(this.B.en.filter(e=>e.hp>0));if(!t)return;
      await this.say(`${nm}は うるうるした目で 見つめた！`,520);
      if(t.final){await this.say('魔王ブルドッグ「そ、そんな目で見てもダメだ！」',800);return;}
      if(Math.random()<(t.boss?0.3:0.75)){t.b.stun=1;Snd.sfx('sel');await this.say(`${t.name}は きゅんとして ひるんだ！`,650);}
      else await this.say(`しかし ${t.name}には きかなかった！`,600);
      return;
    }
    if(sk.kind==='nori'){
      if(!useItemCount('nori')){await this.say('味付けのりが ない！',600);return;}
      await this.say(`${nm}は 味付けのりを 食べた！ パリッ！`,600);Snd.sfx('heal');
      await this.heal(x,0,25);await this.say('!のりパワーで MPが25回復！',650);return;
    }
    if(sk.kind==='buff'){
      Snd.sfx('buff');this.flash('#FFE08A');
      await this.say(`!${nm}の 無料旅行魂が もえあがる！`,900);
      G.party.forEach(m=>{if(m.hp>0){m.b.atk=Math.max(m.b.atk,1.3);m.b.def=Math.max(m.b.def,1.3);m.b.agi=Math.max(m.b.agi,1.3);this.sparks(m);this.updHero(m);}});
      await this.say('全員の 攻撃力・防御力・素早さが 上がった！',800);return;
    }
  },
  async useItem(x,k,t){
    const it=ITEMS[k];
    if(!useItemCount(k)){await this.say(`${it.name}は もう ない！`,600);return;}
    await this.say(`${heroName(x)}は ${it.name}を 使った！`,500);Snd.sfx('heal');
    const tg=t==='all'?G.party.filter(m=>m.hp>0):[t&&t.hp>0?t:x];
    for(const m of tg)await this.heal(m,it.hp||0,it.mp||it.mpheal||0);
    await this.say(k==='legend'?'!伝説のうまさで 全員 全回復！':'回復した！',600);
  },
  /* ---------- enemies ---------- */
  async enemyAct(e){
    const B=this.B;
    if(e.final&&!B.decree&&e.hp<=e.max*0.6){B.decree=true;await this.decree(e);return;}
    const alive=G.party.filter(m=>m.hp>0);if(!alive.length)return;

    switch(k){
      case 'atk':await this.say(`${e.name}の こうげき！`,380);await this.physical(e,tgt,1);break;

        await this.say(`!${e.name}の ${sk.n||'全体攻撃'}！`,500);this.anim(e.el,'lunge',360);this.flash('#FFFFFF');
        for(const m of G.party.filter(h=>h.hp>0)){let d=Math.round(rnd(sk.min||8,sk.max||12)-st(m,'def')*0.08);if(m.b.guard===2)d=Math.floor(d*0.35);else if(m.b.guard)d=Math.floor(d*0.5);await this.damage(m,Math.max(1,d),false);if(this.check())break;}
        break;}
      case 'sleep':
        await this.say(`${e.name}の ${sk.n||'あくび'}！`,450);
        if(Math.random()<0.55){tgt.b.sleep=2;this.updHero(tgt);await this.say(`${heroName(tgt)}は ねむってしまった！`,650);}
        else await this.say(`しかし ${heroName(tgt)}は ねむらなかった！`,600);break;
      case 'karashi':
        await this.say(`${e.name}の ${sk.n||'からし攻撃'}！`,450);await this.physical(e,tgt,0.8);
        if(tgt.hp>0&&Math.random()<0.6){tgt.b.karashi=3;this.updHero(tgt);await this.say(`${heroName(tgt)}は からくて ひーひー言っている！`,650);}break;
      case 'blind':

        G.party.forEach(m=>{if(m.hp>0){m.b.blind=2;this.updHero(m);}});await this.say('湯けむりで 前が見えにくくなった！',650);break;
      case 'heal':{const v=Math.min(e.max-e.hp,sk.amt||20);e.hp+=v;this.updEnemy(e);this.pop(e,'+'+v,'heal');Snd.sfx('heal');
        await this.say(`${e.name}の ${sk.n||'回復'}！ HPが${v}回復した！`,700);break;}
      case 'idle':await this.say(pickOne([`${e.name}は ごろーんと 寝転がっている。`,`${e.name}は ぼーっとしている。`,`${e.name}は しっぽを追いかけている。`]),650);break;
      case 'atkup':e.b.atk=Math.min(1.6,e.b.atk+0.25);Snd.sfx('buff');await this.say(`${e.name}は ぷんぷん怒って 攻撃力が上がった！`,650);break;
      case 'healdown':this.anim(e.el,'lunge',360);B.healDown=3;Snd.sfx('bark');await this.say(`!${e.name}の 温泉封鎖！`,550);await this.say('回復の効果が 半分になった！',650);break;
      case 'steal':{
        await this.say(`${e.name}の ${sk.n||'どろぼう'}！`,450);
        const ids=['nori','nori2','manju','milk'].filter(i=>G.inv[i]);
        if(!ids.length){await this.say('しかし 何も持っていなかった！',600);break;}
        const id=ids[0];useItemCount(id);
        await this.say(e.final?`${ITEMS[id].name}を 1つ 没収された！`:`${ITEMS[id].name}を 1つ 盗まれた！`,700);break;}
      default:await this.say(`${e.name}の こうげき！`,380);await this.physical(e,tgt,1);
    }
  },
  async decree(e){
    this.anim(e.el,'lunge',360);Snd.sfx('bark');this.flash('#E04B5A');
    await this.say('魔王ブルドッグ「ええい、こしゃくな！」',900);
    await this.say('!魔王ブルドッグ「無料旅行禁止令を 発令する！」',1300);
    await this.say('魔王ブルドッグ「今後いっさいの 無料旅行を 禁止とする！」',1300);
    await this.say(`!${G.name}「…………は？」`,1200);
    this.shake();this.flash('#FFE08A');Snd.sfx('buff');
    await this.say(`!${G.name}の 怒りが 頂点に達した！`,1100);
    G.flags.muryo=true;
    const sk=G.party[0];if(sk.hp>0){sk.mp=heroStat(sk).mmp;this.updHero(sk);}
    await this.say('!とくぎ「無料旅行魂」を おぼえた！',1300);
    await this.say('（とくぎから使えるよ。MPは0）',900);
  },
  /* ---------- end ---------- */
  async finish(r){
    const B=this.B;$('#b-cmd').innerHTML='';
    if(r==='win'){
      Snd.stop();Snd.sfx('win');
      const exp=B.en.reduce((a,e)=>a+e.exp,0),gold=B.en.reduce((a,e)=>a+e.gold,0);
      await this.say('!戦闘に 勝利した！',900);
      if(exp)await this.say(`${exp}ポイントの 経験値を かくとく！`,700);
      if(gold){G.gold+=gold;await this.say(`${gold}バウを 手に入れた！`,700);}
      if(!B.opt.boss&&Math.random()<0.14){const d=pickOne(['nori','nori','milk','manju']);addItem(d);Snd.sfx('chest');await this.say(`敵は ${ITEMS[d].name}を 落としていった！`,800);}
      for(const m of G.party){
        m.exp+=exp;let up=false;const newS=[];
        while(m.lv<MAXLV&&m.exp>=EXP[m.lv+1]){
          const b=heroStat(m);m.lv++;const a=heroStat(m);
          if(m.hp>0){m.hp+=a.mhp-b.mhp;}m.mp+=a.mmp-b.mmp;up=true;
          HEROES[m.id].skills.forEach(s=>{if(s[0]===m.lv)newS.push(s[1]);});
        }
        if(up){
          this.anim(m.el,'lvl',950);Snd.sfx('lvl');
          const bn=el('div','lvbanner','LEVEL UP!');$('#b-stage').appendChild(bn);setTimeout(()=>bn.remove(),1500);
          this.updHero(m);await this.say(`!${heroName(m)}は レベル${m.lv}に 上がった！`,1100);
          for(const s of newS)await this.say(`${heroName(m)}は「${SKILLS[s].name}」を おぼえた！`,1000);
        }
      }
    }else if(r==='lose'){
      Snd.stop();Snd.sfx('lose');await this.say('!みんな たおれてしまった……',1600);
    }
    for(const m of G.party){if(r!=='lose'&&m.hp<=0)m.hp=1;delete m.b;delete m.el;}
    B.en.forEach(e=>{delete e.el;});
    return r;
  }
};

    tiles:["###############","#hhh,,,,,,,hhh#","#hhh,,,,,,,hhh#","#,,,,,,,,,,,,,#","#######,#######","#___#_____#___#","#___#_____#___#","#___##___##___#","#_____________#","###_#######_###","#_____________#","#_###_____###_#","#_____________#","#######_#######","######___######","#######E#######"],
    onArrive:async()=>{if(G.flags.mArr)return;G.flags.mArr=true;await S('!魔王の温泉城に 着いた。','モカ|湯けむりが 紫色……','@|入場料、いくらだろう。','チャコ|そこですか。');},
    events:[
      {id:'m_sign',x:6,y:14,kind:'sign',act:()=>S('かんばん|魔王の温泉城　入場料 1,000,000バウ','@|高い。','モカ|払わないで 入りましょ。','!@|無料入場。最高。')},
      {id:'mc1',x:1,y:5,kind:'chest',act:e=>chest(e,'blade')},
      {id:'mc2',x:13,y:5,kind:'chest',act:e=>chest(e,'nori2',3)},
      {id:'mc3',x:1,y:10,kind:'chest',act:e=>chest(e,'milk',3)},
      {id:'mc4',x:13,y:10,kind:'chest',act:e=>chest(e,'manju',3)},
      {id:'m_trial',x:6,y:5,kind:'tub',label:'無料',act:async()=>{
        if(!G.flags.trial){G.flags.trial=true;await S('!「お試し温泉　無料」','@|魔王の城なのに、無料……！','チャコ|罠かもしれません。','@|入ります。');}
        await bath('free',0);await markFree('maou_trial');
      }},
      {id:'m_oke',x:5,y:3,kind:'tub',label:'湯',act:async()=>{await S('魔王軍の 非常用おけ湯だ。','ぱしゃぱしゃ……。');Snd.sfx('heal');healAll();await S('!HPとMPが 全回復した！');}},
      {id:'maou',x:7,y:2,spr:EN.maou.spr,boss:true,cond:()=>G.p<8,act:async()=>{
        await S('魔王ブルドッグ|ブフォフォフォ！ よく来たな、パグども！','魔王ブルドッグ|世界中の温泉も、味付けのりも、無料旅行券も、ぜーんぶ ワシのものだ！','@|なんで？',
          '魔王ブルドッグ|……ワシ、顔が怖いから、温泉に行くと いつも みんなに逃げられるのだ。','魔王ブルドッグ|だから 全部 独り占めしてやるのだ！','チャコ|ちょっと かわいそう……。','@|でも、無料温泉を 封鎖したのは ゆるせない。','!魔王ブルドッグが おそいかかってきた！');
        const r=await Battle.start(['maou'],{boss:true,final:true});
        if(r==='lose'){await wipe();return;}
        G.p=8;await ending();
      }}
    ]
  }
};

/* ================= prologue / ending ================= */
async function prologue(){
  await wait(250);
  await S('ここは ブサ犬王国。','人間は ひとりもいない、犬だけの国。','パグの村に、無料と温泉と味付けのりを こよなく愛する 一匹のパグがいた。',
    '@|……むにゃ。朝か。','@|ん？ ポストに チラシが入ってる。','!「無料温泉ツアー ご招待！　行き先：無料温泉街」','@|無料……温泉……！','!@|タダなら 行く。',
    '村のパグ|おーい、@ー！ 村長が呼んでるよー！','（十字キーで移動。家や人に ぶつかると 話せるよ）','!村長の家は、上の真ん中の家だ。');
}
function buildBath(box,list){
  box.innerHTML='<div class="tub"></div>';
  const n=list.length;
  list.forEach((o,i)=>{const h=el('div','head',dogSVG(o));h.style.left=(n===1?50:12+i*(76/(n-1)))+'%';h.style.transform='translateX(-50%)';box.appendChild(h);});
  for(let i=0;i<3;i++){const s=el('div','steam');s.style.left=(22+i*26)+'%';s.style.animationDelay=(i*0.9)+'s';box.appendChild(s);}
}
async function ending(){
  Field.stop();show('ending');Snd.bgm('ending');
  $('#end-card').classList.remove('on');
  const maouHead={breed:'bulldog',color:'brindle',mood:'sleepy',hat:'towel'};
  buildBath($('#end-bath'),[HEROES.kuro.spr,HEROES.moka.spr,Object.assign({},HEROES.sakichi.spr,{mood:'happy'}),HEROES.chaco.spr,maouHead]);
  await S('魔王ブルドッグ|ぐ、ぐぬぬ……ワシの 負けだ……。','@|ねえ。一緒に 温泉、入る？','魔王ブルドッグ|……いいのか？ ワシ、顔が怖いぞ？','クロ|おれたちも だいたい こんな顔だ。','モカ|しわの数なら 負けないわよ。',
    '!世界中の温泉に、お湯が もどった！','!伝説の味付けのりも、村に もどってきた！',
    'ブサ犬王国の お城にて——','王さま|よくぞ 世界の温泉を 取りもどしてくれた！ ほうびを とらせよう。','@|で、無料温泉は？','!王さま|もちろん 無料じゃ。','!@|最高！');
  const complete=G.free.length>=FREE_TOTAL;
  if(complete){
    await S('王さま|なんと！ 王国の無料サービスを すべて 見つけたとは！','王さま|そなたには「永久無料パス」を 授けよう。','!@|……一生、タダ？','!王さま|一生、タダじゃ。','!♨ 無料旅行コンプリート ♨');
  }
  await S('その夜、みんなで 温泉に入った。','@|味付けのり、うまい。','魔王ブルドッグ|……うまい。','チャコ|あとで しわの間、洗ってあげますね。');
  Pref.cleared=true;if(complete)Pref.complete=true;savePref();
  G.flags.cleared=true;G.map='world';G.station='maou';healAll();writeSave();
  const lead=G.party[0];
  const card=$('#end-card');
  card.innerHTML=`<h2>パグたちの旅は、まだまだ続く……</h2>
    ${complete?'<p style="color:#A33A4A">♨ 無料旅行コンプリート ♨</p>':''}
    <p>プレイ時間　${fmtTime(G.playMs)}<br>${esc(G.name)}　レベル${lead.lv}<br>見つけた無料サービス　${G.free.length}/${FREE_TOTAL}<br>温泉に入った回数　${G.onsen}回</p>
    ${complete?'':'<p style="font-size:13px">まだ見つけていない無料サービスが あるみたい。</p>'}`;
  const b=el('button','btn','タイトルへ');b.onclick=()=>toTitle();card.appendChild(b);
  card.classList.add('on');b.focus({preventScroll:true});
}

/* ================= title / boot ================= */
const HELP=`<div class="help">
<h4>目的</h4><p>パグの「さきち」になって、魔王ブルドッグに封鎖された温泉と、盗まれた伝説の味付けのりを取りもどそう。</p>
<h4>移動</h4><p>画面下の十字キーで移動。押しっぱなしで歩き続けます。パソコンでは矢印キー・WASDでも動けます。</p>
<h4>しらべる・話す</h4><p>人や家、宝箱にぶつかると話せます。「しらべる」ボタン（Enter / スペース）で、向いている方向を調べられます。</p>
<h4>戦闘</h4><p>草むらやダンジョンを歩くと魔物があらわれます。「たたかう」「とくぎ」「どうぐ」「ぼうぎょ」「にげる」から選ぼう。敵をタップして狙うこともできます。ボスからは逃げられません。</p>
<h4>温泉</h4><p>温泉に入るとHPとMPが全回復。無料の温泉に入ると気分が上がって、次の3戦は攻撃力がアップします。有料だと……「……有料か。」</p>
<h4>無料サービス</h4><p>王国のあちこちに、全部で8つの無料サービスがかくれています。全部見つけると、特別なエンディングが待っています。</p>
<h4>無料旅行券・半額クーポン</h4><p>メニューの「どうぐ」から使えます。無料旅行券は全回復＋魔物に会いにくくなる、とてもお得な券です。</p>
<h4>セーブ</h4><p>エリアを移動したり戦闘が終わったりすると自動でセーブされます。メニューや村の教会からもセーブできます。</p>
<h4>力つきたら</h4><p>村か温泉街で目をさまします。所持金は半分になりますが、レベルや持ち物はそのままです。</p></div>`;
function renderTitle(){
  buildBath($('#title-bath'),[HERO_SPR]);
  const sv=Store.get(SAVE_KEY);
  $('#t-cont').disabled=!sv;
  const lines=[];
  if(Pref.complete)lines.push('<span class="clear-mark">♨ 無料旅行コンプリート達成</span>');
  else if(Pref.cleared)lines.push('<span class="clear-mark">★ クリアおめでとう</span>');
  lines.push(`サウンド：${Pref.sound?'オン':'オフ'}（設定で変更できます）`);
  if(!Store.ok)lines.push('この環境ではセーブできません');
  lines.push('約60分で遊べるコマンド式RPG');
  $('#t-foot').innerHTML=lines.join('<br>');
}
function toTitle(){
  Field.stop();Snd.stop();if(Modal.isOpen())Modal.close();Msg.hide();
  show('title');renderTitle();Snd.bgm('title');
}
async function askName(){
  return Modal.open('名前をつけてください',body=>{
    body.appendChild(el('p','','主人公のパグの名前（6文字まで）'));
    const inp=el('input','name');inp.value='さきち';inp.maxLength=6;inp.setAttribute('aria-label','主人公の名前');inp.autocomplete='off';body.appendChild(inp);
    const b=el('button','btn','この名前で はじめる');b.style.width='100%';
    const go=()=>{let v=inp.value.replace(/[|@!<>&"'\\]/g,'').replace(/\s+/g,'').slice(0,6);if(!v)v='さきち';Modal.close(v);};
    b.onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();go();}});
    body.appendChild(b);setTimeout(()=>{try{inp.focus();inp.select();}catch(e){}},50);
  });
}
async function startNew(){
  Snd.sfx('sel');
  if(Store.get(SAVE_KEY)){
    const ok=await Modal.open('はじめから',body=>{
      body.appendChild(el('p','','セーブデータがあります。はじめから遊ぶと、今のセーブデータは上書きされます。'));
      const r=el('div','tabs');const y=el('button','btn','上書きして はじめる');y.onclick=()=>Modal.close(true);
      const n=el('button','btn sub','やめる');n.onclick=()=>Modal.close(false);r.appendChild(y);r.appendChild(n);body.appendChild(r);
    });
    if(!ok)return;
  }
  const name=await askName();if(!name)return;
  newGame(name);Field.enter('village',3,3,'up');Field.run(prologue);
}
function continueGame(){
  Snd.sfx('sel');
  const g=readSave();
  if(g==='broken'||!g){
    Modal.open('つづきから',body=>{body.appendChild(el('p','',g==='broken'?'セーブデータが壊れているため、読みこめませんでした。「はじめから」で新しく遊べます。':'セーブデータがありません。「はじめから」で遊べます。'));});
    return;
  }
  G=g;
  if(G.map==='world'||!MAPS[G.map]){goWorld();return;}
  Field.enter(G.map,G.x,G.y,G.dir);
}
function boot(){
  Msg.setup();Field.setup();
  $('#modal-x').addEventListener('click',()=>Modal.close());
  $('#modal').addEventListener('click',e=>{if(e.target.id==='modal')Modal.close();});
  $('#t-new').addEventListener('click',()=>{if(!Modal.isOpen())startNew();});
  $('#t-cont').addEventListener('click',()=>{if(!Modal.isOpen())continueGame();});
  $('#t-help').addEventListener('click',()=>{Snd.sfx('sel');Modal.open('あそびかた',body=>{body.innerHTML=HELP;});});
  $('#t-set').addEventListener('click',()=>{Snd.sfx('sel');Modal.open('設定',body=>{
    renderSettings(body);
    if(Store.get(SAVE_KEY)){const r=el('div','row');r.innerHTML='<div class="grow">セーブデータを消す<small>元にはもどせません</small></div>';
      const b=el('button','btn','消す');b.onclick=()=>{if(b.dataset.c){Store.del(SAVE_KEY);Modal.close();renderTitle();}else{b.dataset.c='1';b.textContent='本当に消す';}};r.appendChild(b);body.appendChild(r);}
  }).then(renderTitle);});
  $('#w-menu').addEventListener('click',()=>{if(!Msg.on())openMenu();});
  const unlock=()=>{Snd.init();Snd.resume();};
  document.addEventListener('pointerdown',unlock,true);document.addEventListener('keydown',unlock,true);
  const KEYDIR={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};
  document.addEventListener('keydown',e=>{
    const k=e.key;
    if(e.target&&e.target.tagName==='INPUT')return;
    if(Msg.on()){if(['Enter',' ','z','Z'].includes(k)&&!Msg.opts){e.preventDefault();Msg.tap();}return;}
    if(Modal.isOpen()){if(k==='Escape')Modal.close();return;}
    if(curScreen==='field'){
      if(KEYDIR[k]){e.preventDefault();Field.held=KEYDIR[k];if(!Field.mv&&!Field.busy)Field.tryMove(KEYDIR[k]);return;}
      if(['Enter',' ','z','Z'].includes(k)){e.preventDefault();Field.interact();return;}
      if(['Escape','m','M','x','X'].includes(k)){if(!Field.busy&&!Field.mv)openMenu();return;}
    }
    if(curScreen==='world'&&['Escape','m','M'].includes(k))openMenu();
  });
  document.addEventListener('keyup',e=>{const d=KEYDIR[e.key];if(d&&Field.held===d)Field.held=null;});
  window.addEventListener('blur',()=>{Field.held=null;});
  setInterval(()=>{if(G&&curScreen!=='title'&&curScreen!=='ending'&&!document.hidden)G.playMs+=1000;},1000);
  document.addEventListener('visibilitychange',()=>{if(document.hidden){autosave();}});
  window.addEventListener('pagehide',()=>autosave());
  renderTitle();Snd.bgm('title');
}
boot();
})();
</script>
